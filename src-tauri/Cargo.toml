[package]
name = "controlvps"
version = "1.7.0"
description = "Local-first VPS management and discovery"
authors = ["ControlVPS contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/1989tianlong/controlvps"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "controlvps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native"] }
native-tls = { version = "0.2", features = ["vendored"] }
rand_core = "0.6"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls-vendored"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.16"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
