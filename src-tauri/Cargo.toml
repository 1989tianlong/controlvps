[package]
name = "controlvps"
version = "0.2.0"
description = "Local-first VPS management and discovery"
authors = ["ControlVPS contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/1989tianlong/controlvps"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "controlvps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
